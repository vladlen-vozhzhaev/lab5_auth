name: GitHub Classroom Workflow

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: |
          for svc in rating library reservation gateway; do
            (cd "$svc" && mvn -B -q test) || exit 1
          done

      - uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: docker compose build --push

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          sed -i 's/\r$//' ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config current-context

      - name: Deploy Postgres
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm upgrade --install postgres bitnami/postgresql \
            -n rsoi --create-namespace \
            -f helm/values/postgres.yaml

      - name: Wait for Postgres
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=postgresql \
            -n rsoi --timeout=300s

      - name: Init Postgres databases
        run: |
          PG_PASS=$(kubectl get secret -n rsoi postgres-postgresql -o jsonpath='{.data.postgres-password}' | base64 -d)

          kubectl exec -n rsoi postgres-postgresql-0 -- env PGPASSWORD="$PG_PASS" \
            psql -U postgres -c "CREATE USER program WITH PASSWORD 'test' SUPERUSER;" || true

          for db in ratings libraries reservations; do
            kubectl exec -n rsoi postgres-postgresql-0 -- env PGPASSWORD="$PG_PASS" \
              psql -U postgres -c "CREATE DATABASE $db OWNER program;" || true
            kubectl exec -n rsoi postgres-postgresql-0 -- env PGPASSWORD="$PG_PASS" \
              psql -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE $db TO program;"
            kubectl exec -n rsoi postgres-postgresql-0 -- env PGPASSWORD="$PG_PASS" \
              psql -U postgres -d "$db" -c "GRANT ALL ON SCHEMA public TO program;"
            kubectl exec -n rsoi postgres-postgresql-0 -- env PGPASSWORD="$PG_PASS" \
              psql -U postgres -d "$db" -c "ALTER SCHEMA public OWNER TO program;"
          done

      - name: Deploy services
        run: |
          for svc in rating library reservation gateway; do
            helm upgrade --install "$svc" helm/generic-service \
              -n rsoi \
              -f "helm/values/$svc.yaml" \
              --wait --timeout 5m
          done

      - name: Wait for gateway
        run: kubectl rollout status deployment/gateway -n rsoi --timeout=300s

      - name: Install newman
        run: npm install -g newman

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v4/postman/collection.json
          environment: v4/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 5
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"