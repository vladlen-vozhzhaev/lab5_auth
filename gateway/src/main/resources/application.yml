server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway
  jackson:
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://dev-1qtseeouvdob2c1k.us.auth0.com/}
          jwk-set-uri: ${JWT_JWK_SET_URI:https://dev-1qtseeouvdob2c1k.us.auth0.com/.well-known/jwks.json}

rating-url: ${RATING_URL:http://localhost:8050}
library-url: ${LIBRARY_URL:http://localhost:8060}
reservation-url: ${RESERVATION_URL:http://localhost:8070}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true